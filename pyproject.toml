[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "soapff"
version = "1.0.1"
description = "soapff: atom types, charges and the LAMMPS force field of any structure from a library of reference structures (SOAP) - ClayFF, OPLS-AA, TIP3P, SPC/E, and libraries users write"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "ase", "dscribe"]

[project.optional-dependencies]
surfaces = ["pymatgen"]                 # soapff_cui.surfaces: (001) slabs of the minerals
examples = ["lammps[mpi]", "matplotlib", "rdkit"]   # the examples: MD with the LAMMPS Python module, plots, a chain from its SMILES

[project.scripts]
soapff = "soapff.__main__:main"

[project.urls]
Repository = "https://github.com/haru2225/soapff"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# the libraries: the .txt files and their reference structures (and force-field files)
soapff = ["libraries/*.txt", "libraries/*/*.extxyz", "libraries/*/*.data", "libraries/*/*/*.extxyz", "libraries/*/*/*.data",
          "libraries/*/*/*.settings"]
